name: Unity Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  smoke:
    name: Flow content smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Flow content and Showcase presets
        run: python tools/validate_flow_content.py

  unity-editmode:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    needs: smoke
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Detect Unity license
        id: license
        shell: bash
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain skipped Unity execution
        if: steps.license.outputs.available != 'true'
        run: |
          echo "One or more Unity CI credentials are not configured."
          echo "License-free content smoke validation passed, but Unity import/EditMode execution remains blocked."
      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Library
          key: Library-${{ runner.os }}-6000.3.18f1-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-6000.3.18f1-
      - name: Run Unity EditMode tests
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.18f1
          testMode: EditMode
          artifactsPath: artifacts/editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode Tests
      - name: Upload Unity test artifacts
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: artifacts/editmode
          if-no-files-found: warn
