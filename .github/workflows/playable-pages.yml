name: Playable WebGL Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build playable WebGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Flow content
        run: python tools/validate_flow_content.py

      - name: Require Unity license
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is not configured. Add the Unity license secret before GitHub Pages can receive a playable WebGL build."
            exit 1
          fi

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-WebGL-6000.3.18f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-WebGL-6000.3.18f1-
            Library-${{ runner.os }}-WebGL-

      - name: Build Engineering Playground WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.18f1
          targetPlatform: WebGL
          buildMethod: EngineeringPlayground.Editor.EngineeringWebGlBuild.BuildPages

      - name: Verify playable output
        shell: bash
        run: |
          test -f build/WebGL/index.html
          test -f build/WebGL/.nojekyll
          echo "Playable WebGL artifact found."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload playable Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/WebGL

  deploy:
    name: Deploy playable game
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
